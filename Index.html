<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éditeur PDF PWA</title>
  
  <!-- Manifeste PWA embarqué -->
  <link rel="manifest" href="data:application/manifest+json;utf8,{
    %22name%22:%22%C3%89diteur%20PDF%20PWA%22,
    %22short_name%22:%22PDF%20Editor%22,
    %22start_url%22:%22.%22,
    %22display%22:%22standalone%22,
    %22background_color%22:%22%230f172a%22,
    %22theme_color%22:%22%230f172a%22,
    %22icons%22:[{%22src%22:%22data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%232563eb'/><path d='M160 96h128l96 96v224c0 17.7-14.3 32-32 32H160c-17.7 0-32-14.3-32-32V128c0-17.7 14.3-32 32-32z' fill='%23ffffff'/></svg>%22,%22sizes%22:%22512x512%22,%22type%22:%22image/svg+xml%22}]
  }">
  <meta name="theme-color" content="#0f172a">

  <!-- Style Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Librairies PDF -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  </script>

  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    #canvas-container { position: relative; display: inline-block; }
    .text-overlay-input {
      position: absolute;
      background: white;
      color: black;
      border: 2px solid #2563eb;
      border-radius: 4px;
      padding: 2px 4px;
      font-family: sans-serif;
      outline: none;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col select-none">

  <!-- En-tête -->
  <header class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white">PDF</div>
      <h1 class="text-lg font-bold text-slate-100">Éditeur PDF PWA</h1>
    </div>
    <div id="file-info" class="text-xs text-slate-400 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-700">Aucun fichier</div>
  </header>

  <!-- Barre d'outils -->
  <div class="bg-slate-800/90 backdrop-blur p-3 flex flex-wrap gap-4 items-center border-b border-slate-700 sticky top-0 z-20">
    <label class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white px-4 py-2 rounded-xl cursor-pointer font-medium text-sm transition flex items-center gap-2 shadow-md">
      <span>📁 Ouvrir PDF</span>
      <input type="file" id="pdf-upload" accept="application/pdf" class="hidden">
    </label>

    <div class="flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-700">
      <span class="text-xs text-slate-400">Taille:</span>
      <input type="number" id="font-size" value="16" min="8" max="72" class="w-12 bg-transparent text-white text-center text-sm font-bold outline-none">
    </div>

    <div class="flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-700">
      <span class="text-xs text-slate-400">Texte:</span>
      <input type="color" id="text-color" value="#000000" class="w-6 h-6 rounded-lg border-0 cursor-pointer bg-transparent">
    </div>

    <div class="flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-700">
      <span class="text-xs text-slate-400">Masque:</span>
      <input type="color" id="bg-color" value="#ffffff" class="w-6 h-6 rounded-lg border-0 cursor-pointer bg-transparent">
    </div>

    <button id="download-btn" disabled class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 disabled:opacity-40 disabled:pointer-events-none text-white px-4 py-2 rounded-xl font-medium text-sm ml-auto transition shadow-md flex items-center gap-2">
      💾 Télécharger
    </button>
  </div>

  <!-- Zone de travail -->
  <main class="flex-1 flex justify-center items-start p-4 overflow-auto">
    <div id="editor-wrapper" class="hidden flex-col items-center gap-4">
      <div id="canvas-container" class="border border-slate-700 shadow-2xl rounded-lg bg-white overflow-hidden">
        <canvas id="pdf-render"></canvas>
      </div>
      <p class="text-slate-400 text-xs bg-slate-800/80 px-4 py-2 rounded-full border border-slate-700">
        💡 Cliquez n'importe où sur le document pour ajouter ou remplacer du texte.
      </p>
    </div>

    <div id="empty-state" class="text-center py-24 text-slate-500 flex flex-col items-center gap-3">
      <div class="w-16 h-16 rounded-2xl bg-slate-800 flex items-center justify-center text-3xl">📄</div>
      <p class="text-sm font-medium">Ouvrez un fichier PDF pour commencer l'édition</p>
    </div>
  </main>

  <script>
    // Enregistrement du Service Worker embarqué
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'pdf-pwa-v1';
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
        self.addEventListener('fetch', (e) => {
          e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    let pdfBytes = null;
    let pdfDocJs = null;
    let scale = 1.5;
    let additions = [];

    const fileInput = document.getElementById('pdf-upload');
    const canvas = document.getElementById('pdf-render');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    const downloadBtn = document.getElementById('download-btn');
    const editorWrapper = document.getElementById('editor-wrapper');
    const emptyState = document.getElementById('empty-state');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('file-info').textContent = file.name;
      pdfBytes = await file.arrayBuffer();

      const loadingTask = pdfjsLib.getDocument({ data: pdfBytes });
      pdfDocJs = await loadingTask.promise;

      const page = await pdfDocJs.getPage(1);
      const viewport = page.getViewport({ scale: scale });

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;

      emptyState.classList.add('hidden');
      editorWrapper.classList.remove('hidden');
      editorWrapper.classList.add('flex');
      downloadBtn.disabled = false;
    });

    container.addEventListener('click', (e) => {
      if (e.target !== canvas && e.target !== container) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'text-overlay-input';
      
      const fontSize = document.getElementById('font-size').value;
      const textColor = document.getElementById('text-color').value;
      const bgColor = document.getElementById('bg-color').value;

      input.style.left = `${clickX}px`;
      input.style.top = `${clickY}px`;
      input.style.fontSize = `${fontSize * scale}px`;
      input.style.color = textColor;
      input.style.backgroundColor = bgColor;

      container.appendChild(input);
      setTimeout(() => input.focus(), 50);

      input.addEventListener('blur', () => {
        if (input.value.trim() !== '') {
          additions.push({
            x: clickX,
            y: clickY,
            text: input.value,
            fontSize: parseInt(fontSize),
            textColor: textColor,
            bgColor: bgColor,
            canvasWidth: canvas.width,
            canvasHeight: canvas.height
          });
          drawOnCanvas(clickX, clickY, input.value, fontSize * scale, textColor, bgColor);
        }
        input.remove();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') input.blur();
      });
    });

    function drawOnCanvas(x, y, text, fontSize, textColor, bgColor) {
      ctx.font = `${fontSize}px sans-serif`;
      const textMetrics = ctx.measureText(text);
      const width = textMetrics.width + 8;
      const height = fontSize * 1.2;

      ctx.fillStyle = bgColor;
      ctx.fillRect(x, y - height * 0.7, width, height);

      ctx.fillStyle = textColor;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(text, x + 4, y);
    }

    downloadBtn.addEventListener('click', async () => {
      if (!pdfBytes) return;

      const { PDFDocument, rgb } = PDFLib;
      const pdfDoc = await PDFDocument.load(pdfBytes);
      const page = pdfDoc.getPages()[0];
      const { width: pdfWidth, height: pdfHeight } = page.getSize();

      const hexToRgb = (hex) => {
        const r = parseInt(hex.slice(1, 3), 16) / 255;
        const g = parseInt(hex.slice(3, 5), 16) / 255;
        const b = parseInt(hex.slice(5, 7), 16) / 255;
        return rgb(r, g, b);
      };

      additions.forEach(item => {
        const scaleX = pdfWidth / item.canvasWidth;
        const scaleY = pdfHeight / item.canvasHeight;

        const pdfX = item.x * scaleX;
        const pdfY = pdfHeight - (item.y * scaleY);

        const fontHeight = item.fontSize;
        const textWidth = item.text.length * (fontHeight * 0.55);

        page.drawRectangle({
          x: pdfX,
          y: pdfY - (fontHeight * 0.2),
          width: textWidth + 8,
          height: fontHeight * 1.2,
          color: hexToRgb(item.bgColor)
        });

        page.drawText(item.text, {
          x: pdfX + 4,
          y: pdfY,
          size: fontHeight,
          color: hexToRgb(item.textColor)
        });
      });

      const modifiedPdfBytes = await pdfDoc.save();
      const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'document_modifie.pdf';
      link.click();
    });
  </script>
</body>
</html>
